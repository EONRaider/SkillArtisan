name: Self-test audit action

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  audit-report-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SkillArtisan audit (report only, no API key)
        uses: ./
        with:
          skills-path: skill-artisan/tests/fixtures
